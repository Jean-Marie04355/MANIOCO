---
services:
  mongodb:
    image: mongo:latest
    container_name: afrigari-mongodb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: afrigari-redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: afrigari-mailpit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:1025:1025"  # SMTP port
      - "127.0.0.1:8025:8025"  # Web UI port
    restart: always

  minio:
    image: minio/minio
    container_name: afrigari-minio
    ports:
      - "127.0.0.1:3900:9000"
      - "127.0.0.1:3901:9001"
    environment:
      MINIO_ROOT_USER: GK5998626ffd74db3814c16280
      MINIO_ROOT_PASSWORD: 2c0708b326a49c1b37994db2b65d34a9e99eb60fe9eb42f73ab75db3e00805aa
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    restart: always
