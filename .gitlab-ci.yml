include:
  - project: 'devopsTeam/devopstemplatefiles'
    file: 'svcitemplate.yml'
    ref: 'main'

# On renomme notre job pour correspondre à ce que le template attend
test_coverage_node:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd backend
    - npm ci --prefer-offline
    - npx jest --coverage --coverageReporters=lcov --coverageDirectory=coverage --passWithNoTests --forceExit
    - sed -i 's|^SF:|SF:backend/|' coverage/lcov.info
  artifacts:
    paths:
      - backend/coverage/lcov.info
    expire_in: 1 day

# On garde notre job frontend à part
frontend-coverage:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run test:cov
    - sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info
  artifacts:
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 day

# On surcharge Sonar en rendant les dépendances manquantes OPTIONNELLES
sonarqube-checker:
  needs: 
    - job: svscanners_check
      optional: true
    - job: dockerfile_conformity_check
      optional: true
    - job: others_infra_conformity_check
      optional: true
    - job: initial_security_checkpoint
      optional: true
    - job: security_check
      optional: true
    - job: test_coverage_node
      optional: false # Celui-là on le veut absolument !
    - job: test_coverage_fastapi
      optional: true
    - job: frontend-coverage
      optional: false # Celui-là aussi !
  variables:
    SONAR_SOURCES: "backend/src,frontend/src"
    SONAR_SCANNER_OPTS: "-Xmx4096m"
    SONAR_OPTS: "-Dsonar.scanner.skipSystemTruststore=true"
