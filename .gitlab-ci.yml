include:
  - project: 'devopsTeam/devopstemplatefiles'
    file: 'svcitemplate.yml'
    ref: 'main'

# ─────────────────────────────────────────────────────────────
# Job: génère le rapport de couverture backend (LCOV) pour Sonar
# ─────────────────────────────────────────────────────────────
backend-coverage:
  stage: test
  image: node:20-alpine
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npx jest --coverage --coverageReporters=lcov --coverageDirectory=coverage --passWithNoTests --forceExit
  artifacts:
    when: always
    paths:
      - backend/coverage/lcov.info
    expire_in: 1 day
  allow_failure: true

sonarqube-checker:
  stage: test
  services: []
  needs:
    - job: backend-coverage
      artifacts: true
  allow_failure: true
  variables:
    SONAR_SOURCES: "backend/src"
    SONAR_SCANNER_OPTS: "-Xmx4096m"
    SONAR_OPTS: "-Dsonar.scanner.skipSystemTruststore=true"
