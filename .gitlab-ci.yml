include:
  - project: 'devopsTeam/devopstemplatefiles'
    file: 'svcitemplate.yml'
    ref: 'main'

# On utilise les noms attendus par le template si possible, ou on les complète
backend-coverage:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd backend
    - npm ci --prefer-offline
    - npx jest --coverage --coverageReporters=lcov --coverageDirectory=coverage --passWithNoTests --forceExit
    - sed -i 's|^SF:|SF:backend/|' coverage/lcov.info
  artifacts:
    paths:
      - backend/coverage/lcov.info
    expire_in: 1 day

frontend-coverage:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run test:cov
    - sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info
  artifacts:
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 day

# On surcharge Sonar en remettant TOUTE la liste des dépendances obligatoires
sonarqube-checker:
  needs: 
    - svscanners_check
    - dockerfile_conformity_check
    - others_infra_conformity_check
    - initial_security_checkpoint
    - security_check
    - test_coverage_node
    - test_coverage_fastapi
    - backend-coverage
    - frontend-coverage
  variables:
    SONAR_SOURCES: "backend/src,frontend/src"
    SONAR_SCANNER_OPTS: "-Xmx4096m"
    SONAR_OPTS: "-Dsonar.scanner.skipSystemTruststore=true"
