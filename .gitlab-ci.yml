include:
  - project: 'devopsTeam/devopstemplatefiles'
    file: 'svcitemplate.yml'
    ref: 'main'

# Génération couverture Backend
backend-coverage:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd backend
    - npm ci --prefer-offline
    - npx jest --coverage --coverageReporters=lcov --coverageDirectory=coverage --passWithNoTests --forceExit
    - sed -i 's|^SF:|SF:backend/|' coverage/lcov.info
  artifacts:
    paths:
      - backend/coverage/lcov.info
    expire_in: 1 day

# Génération couverture Frontend
frontend-coverage:
  stage: check
  image: node:20-alpine
  tags:
    - easyjob
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run test:cov
    - sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info
  artifacts:
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 day

# Surcharge du job Sonar pour inclure nos rapports
sonarqube-checker:
  needs: ["backend-coverage", "frontend-coverage"]
  variables:
    SONAR_SOURCES: "backend/src,frontend/src"
    SONAR_SCANNER_OPTS: "-Xmx4096m"
    SONAR_OPTS: "-Dsonar.scanner.skipSystemTruststore=true"
