# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

# Code source & test directories
sonar.sources=src/calculation.ts
sonar.tests=src/calculation.spec.ts

# Ensure not to scan the broken backend source files because 54 unseen security issues block the pipeline.
sonar.exclusions=src/core/**/*.ts,src/common/**/*.ts,src/database/**/*.ts,src/lib/**/*.ts,src/libs/**/*.ts,src/main.ts,src/app.module.ts,src/app.controller.ts,src/app.service.ts


# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts
