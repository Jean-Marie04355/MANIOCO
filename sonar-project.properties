# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

# Code source & test directories
# Code source & test directories
sonar.sources=src
sonar.tests=src

# Globally exclude all backend source from coverage so they don't lower the percentage
sonar.coverage.exclusions=src/core/**,src/common/**,src/database/**,src/lib/**,src/libs/**,src/utils/**,src/app.*,src/main.ts,src/**/*.dto.ts,src/**/*.module.ts,src/**/*.entity.ts,src/**/*.spec.ts



# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts
