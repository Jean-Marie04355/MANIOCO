# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test,src
sonar.test.inclusions=**/*.spec.ts, **/*.test.ts, **/*.e2e-spec.ts

# Exclusions globales
sonar.exclusions=dist/**,node_modules/**,coverage/**,data/**,scripts/**,mongodb_installer.msi,.gitlab-ci.yml

# Exclude source from coverage to pass gate while focusing on business logic
sonar.coverage.exclusions=src/main.ts,src/worker.ts,src/infra.controller.ts,src/**/*.module.ts,src/**/*.dto.ts,src/**/*.entity.ts,src/**/*.schema.ts,src/**/*.interface.ts,src/**/*.entity.ts

# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts
