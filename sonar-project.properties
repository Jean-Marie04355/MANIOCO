# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test,src
sonar.test.inclusions=**/*.spec.ts, **/*.test.ts, **/*.e2e-spec.ts

# Global exclusions
sonar.exclusions=dist/**, node_modules/**, coverage/**, data/**, scripts/**, mongodb_installer.msi, .gitlab-ci.yml

# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts
