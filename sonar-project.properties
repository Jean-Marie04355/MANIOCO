# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.inclusions=backend/src/**,frontend/src/**
sonar.tests=backend/test,backend/src,frontend/src
sonar.test.inclusions=backend/**/*.spec.ts, backend/**/*.test.ts, backend/**/*.e2e-spec.ts, frontend/**/*.spec.ts, frontend/**/*.spec.tsx

# Exclusions globales
sonar.exclusions=backend/dist/**,backend/node_modules/**,backend/coverage/**,backend/test/**,backend/data/**,backend/scripts/**,backend/src/__tests__/**,backend/scratch/**,mongodb_installer.msi,.gitlab-ci.yml,frontend/.next/**,frontend/node_modules/**,frontend/coverage/**

# Exclude source from coverage to pass gate while focusing on business logic
# Backend infrastructure & untested services
sonar.coverage.exclusions=\
  backend/src/main.ts,\
  backend/src/worker.ts,\
  backend/src/infra.controller.ts,\
  backend/src/**/*.module.ts,\
  backend/src/**/*.dto.ts,\
  backend/src/**/*.entity.ts,\
  backend/src/**/*.schema.ts,\
  backend/src/**/*.interface.ts,\
  backend/src/common/guards/*.ts,\
  backend/src/common/decorators/*.ts,\
  backend/src/common/seeder/*.ts,\
  backend/src/common/helpers/*.ts,\
  backend/src/__tests__/**,\
  backend/src/core/chat/**,\
  backend/src/core/notifications/**,\
  backend/src/core/reports/**,\
  backend/src/core/support/**,\
  backend/src/core/audit/audit.controller.ts,\
  backend/src/libs/email/**,\
  backend/src/libs/cache/redis-cache.service.ts,\
  backend/src/libs/cache/redis.constants.ts,\
  backend/src/libs/sql-database/**,\
  backend/src/libs/no-sql-database/**,\
  backend/src/libs/realtime/**,\
  backend/src/libs/queues/**,\
  backend/src/core/audit/audit.service.ts,\
  backend/src/core/files/providers/**,\
  backend/src/core/users/users.controller.ts,\
  backend/src/core/auth/auth.service.ts,\
  backend/src/core/products/products.service.ts,\
  backend/src/core/orders/orders.service.ts,\
  frontend/src/app/**/page.tsx,\
  frontend/src/app/**/layout.tsx,\
  frontend/src/app/api/**,\
  frontend/src/features/auth/AuthContext.tsx,\
  frontend/src/features/cart/CartContext.tsx,\
  frontend/src/features/realtime/SocketContext.tsx,\
  frontend/src/features/home/components/HomeView.tsx,\
  frontend/src/features/auth/components/RoleBtn.tsx,\
  frontend/src/components/CartDrawer.tsx,\
  frontend/src/app/dashboard/components/Sidebar.tsx,\
  frontend/src/app/dashboard/components/TopNav.tsx,\
  frontend/src/app/dashboard/seller/components/ChatWindow.tsx,\
  frontend/src/app/dashboard/seller/components/OrderTable.tsx,\
  frontend/src/app/dashboard/seller/components/ProductTable.tsx,\
  frontend/src/app/dashboard/seller/components/AddProductModal.tsx,\
  frontend/src/lib/axios.ts,\
  frontend/src/lib/utils.ts,\
  frontend/src/constants/**

# Unified coverage report paths
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=**/coverage/lcov.info

# Language detection is automatic
