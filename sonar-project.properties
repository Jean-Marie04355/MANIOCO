# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.inclusions=backend/src/**,frontend/src/**
sonar.tests=backend/test,backend/src,frontend/src
sonar.test.inclusions=backend/**/*.spec.ts, backend/**/*.test.ts, backend/**/*.e2e-spec.ts, frontend/**/*.spec.ts, frontend/**/*.spec.tsx

# Exclusions globales
sonar.exclusions=backend/dist/**,backend/node_modules/**,backend/coverage/**,backend/test/**,backend/data/**,backend/scripts/**,backend/src/__tests__/**,backend/scratch/**,mongodb_installer.msi,.gitlab-ci.yml,frontend/.next/**,frontend/node_modules/**,frontend/coverage/**

# Exclude source from coverage to pass gate while focusing on business logic
sonar.coverage.exclusions=backend/src/main.ts,backend/src/worker.ts,backend/src/infra.controller.ts,backend/src/**/*.module.ts,backend/src/**/*.dto.ts,backend/src/**/*.entity.ts,backend/src/**/*.schema.ts,backend/src/**/*.interface.ts,backend/src/common/guards/*.ts,backend/src/common/decorators/*.ts,backend/src/common/seeder/*.ts,backend/src/common/helpers/*.ts,backend/src/__tests__/**

# Unified coverage report paths (comma-separated)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Language
sonar.language=ts
