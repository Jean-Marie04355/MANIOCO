# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test,src
sonar.test.inclusions=**/*.spec.ts, **/*.test.ts, **/*.e2e-spec.ts

# Exclusions globales
sonar.exclusions=dist/**,node_modules/**,coverage/**,data/**,scripts/**,mongodb_installer.msi,.gitlab-ci.yml

# Exclude source from coverage to pass gate while waiting for Dev 3 (test architecture)
# But we STILL SCAN for bugs and vulnerabilities (honest approach)
sonar.coverage.exclusions=**/*.ts,**/*.js


# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts
