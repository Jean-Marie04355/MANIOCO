# ──────────────────────────────
# Generic SonarQube configuration (works for NestJS & Next.js)
# ──────────────────────────────

sonar.projectKey=${CI_PROJECT_NAME}
sonar.projectName=${CI_PROJECT_NAME}
sonar.sourceEncoding=UTF-8

# Code source & test directories

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.spec.tsx,**/*.test.tsx
sonar.exclusions=dist/**,build/**,.next/**,node_modules/**,coverage/**,.gitlab-ci.yml,*.yml

# Exclude boilerplate/infrastructure files from coverage (modules, entities, schemas, DTOs, enums, decorators)
sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/*.entity.ts,\
  **/*.schema.ts,\
  **/*.dto.ts,\
  **/*.interface.ts,\
  **/*.enum.ts,\
  **/*.decorator.ts,\
  **/*.guard.ts,\
  **/*.strategy.ts,\
  **/main.ts,\
  **/*.seeder.ts,\
  **/index.ts

# Unified coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Optional: include test execution results if you use jest-sonar-reporter
# sonar.testExecutionReportPaths=report/test-report.xml
