<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test FedaPay Integration - Afrigari</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .step {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .step:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .number {
            background: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        h2 {
            font-size: 1.1rem;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569;
        }

        .dot.success { background: #22c55e; }
        .dot.error { background: #ef4444; }

        #result-area {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .btn-payment {
            background: #22c55e;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FedaPay Test Center</h1>
        <p class="subtitle">Testez l'intégration du split-payment en 3 clics.</p>

        <div class="step">
            <div class="step-header">
                <div class="number">1</div>
                <h2>Créer un Vendeur</h2>
            </div>
            <button id="btn-user">Générer Utilisateur</button>
            <div class="status" id="status-user"><span class="dot"></span> En attente...</div>
        </div>

        <div class="step">
            <div class="step-header">
                <div class="number">2</div>
                <h2>Créer une Boutique</h2>
            </div>
            <button id="btn-store" disabled>Créer Boutique</button>
            <div class="status" id="status-store"><span class="dot"></span> En attente...</div>
        </div>

        <div class="step">
            <div class="step-header">
                <div class="number">3</div>
                <h2>Passer Commande</h2>
            </div>
            <button id="btn-order" disabled>Payer 1 000 FCFA</button>
        </div>

        <div id="result-area">
            <p style="text-align: center; margin-bottom: 16px; color: #4ade80;">✅ Tout est prêt !</p>
            <a href="#" id="pay-link" class="btn-payment" target="_blank">ALLER SUR FEDAPAY</a>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:3000';
        let userId = '';
        let storeId = '';

        const statusUser = document.getElementById('status-user');
        const statusStore = document.getElementById('status-store');
        const btnUser = document.getElementById('btn-user');
        const btnStore = document.getElementById('btn-store');
        const btnOrder = document.getElementById('btn-order');
        const resultArea = document.getElementById('result-area');
        const payLink = document.getElementById('pay-link');

        function setStatus(el, text, type) {
            el.innerHTML = `<span class="dot ${type}"></span> ${text}`;
        }

        btnUser.onclick = async () => {
            btnUser.disabled = true;
            try {
                const res = await fetch(`${baseUrl}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Test User',
                        email: `test_${Date.now()}@afrigari.com`,
                        password: 'password123',
                        role: 'vendeur'
                    })
                });
                const data = await res.json();
                userId = data.id;
                setStatus(statusUser, 'Vendeur créé avec succès !', 'success');
                btnStore.disabled = false;
            } catch (e) {
                setStatus(statusUser, 'Erreur serveur. Lancez npm run start:dev !', 'error');
                btnUser.disabled = false;
            }
        };

        btnStore.onclick = async () => {
            btnStore.disabled = true;
            try {
                // On passe par un endpoint fictif ou on désactive temporairement les guards
                const res = await fetch(`${baseUrl}/stores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Boutique de Test',
                        ownerId: userId,
                        localisation: 'Cotonou',
                        description: 'Ma boutique de test FedaPay',
                        phone: '22900000000',
                        payoutAccountId: 'acc_p8p8p8'
                    })
                });
                const data = await res.json();
                storeId = data.id;
                
                if (!storeId) throw new Error(data.message);

                setStatus(statusStore, 'Boutique créée avec succès !', 'success');
                btnOrder.disabled = false;
            } catch (e) {
                setStatus(statusStore, 'Erreur: ' + e.message, 'error');
                btnStore.disabled = false;
            }
        };

        btnOrder.onclick = async () => {
            btnOrder.disabled = true;
            try {
                const res = await fetch(`${baseUrl}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerId: userId,
                        storeId: storeId,
                        totalAmount: 1000,
                        items: [{ productId: 'test-1', productName: 'Test Item', quantity: 1, price: 1000 }]
                    })
                });
                const data = await res.json();
                
                if (data.paymentUrl) {
                    payLink.href = data.paymentUrl;
                    resultArea.style.display = 'block';
                } else {
                    alert('Erreur: ' + JSON.stringify(data));
                }
            } catch (e) {
                alert('Erreur: ' + e.message);
                btnOrder.disabled = false;
            }
        };
    </script>
</body>
</html>
